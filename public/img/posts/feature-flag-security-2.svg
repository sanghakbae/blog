<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 292" width="880" height="292" role="img" aria-label="감추는 강도">
<rect width="880" height="292" rx="14" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="879" height="291" rx="13.5" fill="none" stroke="#e4e4e7"/>
<text x="24" y="34" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#71717a" letter-spacing="0.04em">감추는 강도</text>
<rect x="24" y="60" width="832" height="42" rx="9" fill="#fafafa" stroke="#e4e4e7"/>
<text x="40" y="86" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#18181b">배포하지 않음</text>
<text x="840" y="86" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11" fill="#71717a" text-anchor="end">가장 확실</text>
<rect x="58" y="112" width="764" height="42" rx="9" fill="#fafafa" stroke="#e4e4e7"/>
<text x="74" y="138" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#18181b">서버 인가로 제한</text>
<text x="806" y="138" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11" fill="#71717a" text-anchor="end">실효 있는 통제</text>
<rect x="92" y="164" width="696" height="42" rx="9" fill="#fafafa" stroke="#e4e4e7"/>
<text x="108" y="190" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#18181b">플래그로 화면 숨김</text>
<text x="772" y="190" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11" fill="#71717a" text-anchor="end">노출 시점 조절</text>
<rect x="126" y="216" width="628" height="42" rx="9" fill="#eef2ff" stroke="#4f46e5"/>
<text x="142" y="242" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#4f46e5">주소를 안 알림</text>
<text x="738" y="242" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11" fill="#71717a" text-anchor="end">통제가 아님</text>
</svg>