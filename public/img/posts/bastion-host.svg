<text x="333.75" y="94" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#18181b" text-anchor="middle">승인</text>
<text x="333.75" y="118" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#71717a" text-anchor="middle">자동 정책 또는 담당자</text>
