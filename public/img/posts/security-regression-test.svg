<text x="307.5" y="283" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#18181b" text-anchor="middle">주기 사이에 재도입</text>
<rect x="485" y="212" width="355" height="150" fill="#fafafa" stroke="#e4e4e7"/>
<text x="662.5" y="283" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#18181b" text-anchor="middle">사실상 방지 없음</text>
<text x="307.5" y="396" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" fill="#71717a" text-anchor="middle">거부 동작 검증</text>
<text x="662.5" y="396" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" fill="#71717a" text-anchor="middle">정상 동작만 검증</text>
