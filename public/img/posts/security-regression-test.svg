<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="테스트 유형과 회귀 방지 효과">
<rect width="880" height="420" rx="14" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="879" height="419" rx="13.5" fill="none" stroke="#e4e4e7"/>
<text x="24" y="34" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#71717a" letter-spacing="0.04em">테스트 유형과 회귀 방지 효과</text>
<rect x="130" y="62" width="355" height="150" fill="#fafafa" stroke="#e4e4e7"/>
<text x="307.5" y="133" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#18181b" text-anchor="middle">회귀 방지됨</text>
<rect x="485" y="62" width="355" height="150" fill="#eef2ff" stroke="#e4e4e7"/>
<text x="662.5" y="133" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#4f46e5" text-anchor="middle">결함이 재도입된다</text>
