<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 388" width="880" height="388" role="img" aria-label="비밀값이 유출됐을 때">
<rect width="880" height="388" rx="14" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="879" height="387" rx="13.5" fill="none" stroke="#e4e4e7"/>
<text x="24" y="34" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#71717a" letter-spacing="0.04em">비밀값이 유출됐을 때</text>
<path d="M42 92 L42 124" stroke="#e4e4e7" stroke-width="2"/>
<circle cx="42" cy="76" r="15" fill="#eef2ff" stroke="#4f46e5"/>
<text x="42" y="81" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="700" fill="#4f46e5" text-anchor="middle">1</text>
<text x="72" y="73" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#18181b">즉시 폐기</text>
<text x="72" y="93" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" fill="#71717a">되돌리기보다 폐기가 먼저다</text>
<path d="M42 154 L42 186" stroke="#e4e4e7" stroke-width="2"/>
<circle cx="42" cy="138" r="15" fill="#eef2ff" stroke="#4f46e5"/>
<text x="42" y="143" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="700" fill="#4f46e5" text-anchor="middle">2</text>
<text x="72" y="135" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#18181b">새 키 발급과 배포</text>
<text x="72" y="155" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" fill="#71717a">이중 유효 기간을 둬 무중단 교체</text>
<path d="M42 216 L42 248" stroke="#e4e4e7" stroke-width="2"/>
<circle cx="42" cy="200" r="15" fill="#eef2ff" stroke="#4f46e5"/>
<text x="42" y="205" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="700" fill="#4f46e5" text-anchor="middle">3</text>
<text x="72" y="197" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#18181b">사용 이력 조사</text>
<text x="72" y="217" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" fill="#71717a">유출 시점부터의 접근 로그 확인</text>
<path d="M42 278 L42 310" stroke="#e4e4e7" stroke-width="2"/>
<circle cx="42" cy="262" r="15" fill="#eef2ff" stroke="#4f46e5"/>
<text x="42" y="267" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="700" fill="#4f46e5" text-anchor="middle">4</text>
<text x="72" y="259" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#18181b">이력에서 제거</text>
<text x="72" y="279" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" fill="#71717a">저장소 히스토리 재작성</text>

<circle cx="42" cy="324" r="15" fill="#eef2ff" stroke="#4f46e5"/>
<text x="42" y="329" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="700" fill="#4f46e5" text-anchor="middle">5</text>
<text x="72" y="321" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#18181b">재발 방지</text>
<text x="72" y="341" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" fill="#71717a">커밋 훅과 스캐닝 적용</text>
</svg>