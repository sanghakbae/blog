<text x="24" y="34" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#71717a" letter-spacing="0.04em">네트워크 정책 도입 순서</text>
<path d="M42 92 L42 124" stroke="#e4e4e7" stroke-width="2"/>
