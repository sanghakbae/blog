<text x="772" y="190" font-family="-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11" fill="#71717a" text-anchor="end">요청 본문에 값 포함</text>
<rect x="126" y="216" width="628" height="42" rx="9" fill="#eef2ff" stroke="#4f46e5"/>
