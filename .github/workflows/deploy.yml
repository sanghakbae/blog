name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 글은 웹 에디터에서 Firestore 로 바로 저장되므로 깃에 커밋이 남지 않는다.
  # 크롤러가 읽는 정적 HTML 과 sitemap 은 빌드할 때 만들어지므로,
  # 하루 한 번 다시 빌드해 수정한 글이 검색엔진에 반영되게 한다. (06:00 KST)
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsc -b

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_ADMIN_EMAILS: ${{ vars.VITE_ADMIN_EMAILS }}
          VITE_UPLOAD_ENDPOINT: ${{ vars.VITE_UPLOAD_ENDPOINT }}

      # GitHub Pages 는 서버 라우팅이 없다. 404 를 index 로 돌려
      # /tags/:tag 같은 클라이언트 경로가 새로고침에도 살아남게 한다.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      # 최근에 바뀐 주소만 알린다. 키 파일은 공개 주소로 검증하는 방식이라
      # 비밀값이 아니고 public/ 에 그대로 들어 있다.
      # 색인 통보가 실패해도 배포는 계속한다.
      - name: IndexNow
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: npx tsx scripts/indexnow.mts --days=2

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
