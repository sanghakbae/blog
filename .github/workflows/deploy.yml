name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 글은 웹 에디터에서 Firestore 로 바로 저장되므로 깃에 커밋이 남지 않는다.
  # 크롤러가 읽는 정적 HTML 과 sitemap 은 빌드할 때 만들어지므로,
  # 하루 두 번 다시 빌드해 수정한 글이 검색엔진에 반영되게 한다.
  # 06:00 · 18:00 KST (UTC 로 21:00 · 09:00)
  schedule:
    - cron: '0 21 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsc -b

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_ADMIN_EMAILS: ${{ vars.VITE_ADMIN_EMAILS }}
          VITE_UPLOAD_ENDPOINT: ${{ vars.VITE_UPLOAD_ENDPOINT }}
          # 광고 — 값이 비어 있으면 배너 자리를 아예 만들지 않는다.
          # 비밀이 아니라 페이지에 그대로 드러나는 값이라 secrets 가 아닌 vars 다.
          VITE_COUPANG_PARTNER_ID: ${{ vars.VITE_COUPANG_PARTNER_ID }}
          VITE_COUPANG_TRACKING_CODE: ${{ vars.VITE_COUPANG_TRACKING_CODE }}
          VITE_ADFIT_UNIT_ID: ${{ vars.VITE_ADFIT_UNIT_ID }}
          # 애드센스 — 게시자 ID 는 ads.txt 생성에도 쓰인다.
          VITE_ADSENSE_CLIENT: ${{ vars.VITE_ADSENSE_CLIENT }}
          VITE_ADSENSE_SLOT: ${{ vars.VITE_ADSENSE_SLOT }}

      # GitHub Pages 는 서버 라우팅이 없다. 404 응답에도 앱 셸이 실려야
      # /tags/:tag 같은 클라이언트 경로가 새로고침에도 살아남는다.
      # 정상 빌드에서는 prerender 가 noindex 를 단 404 를 이미 만들어 둔다.
      # 여기서는 그것이 없을 때만 채운다 — 홈 내용을 없는 주소에 복사하지 않는다.
      - name: SPA fallback
        run: '[ -f dist/404.html ] || cp dist/index.html dist/404.html'

      # 최근에 바뀐 주소만 알린다. 키 파일은 공개 주소로 검증하는 방식이라
      # 비밀값이 아니고 public/ 에 그대로 들어 있다.
      # 색인 통보가 실패해도 배포는 계속한다.
      - name: IndexNow
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: npx tsx scripts/indexnow.mts --days=2

      # 구글이 사이트맵을 다시 읽게 한다. 이것이 없으면 새 글이 며칠씩 밀린다.
      # 호출 한 번이라 배포마다 걸어도 부담이 없다.
      # 서비스 계정 키가 없으면 건너뛴다 — 설정 전에도 배포는 되어야 한다.
      - name: 사이트맵 재제출
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          SA_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_KEY" ]; then
            echo 'GCP_SERVICE_ACCOUNT 시크릿이 없어 건너뜁니다.'
            exit 0
          fi
          trap 'rm -f /tmp/sa.json' EXIT
          printf '%s' "$SA_KEY" > /tmp/sa.json
          chmod 600 /tmp/sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json npx tsx scripts/gsc-verify.mts sitemap

      # 색인됐는지는 Search Console URL 검사 API 로 확인해 Firestore 에 기록한다.
      # 관리 콘솔의 색인 배지가 이 값으로 자동으로 바뀐다.
      #
      # 글 한 편이 호출 한 번이라 251편이면 251건이다. URL 검사 API 한도는
      # 하루 2,000건이므로 배포마다 돌리면 하루 여덟 번 배포에서 한도를 넘긴다.
      # 실제로 그렇게 됐다 — 2026-09-07 에 11번 배포하며 238편이 할당량 초과로
      # 조회되지 못했다. 그래서 정해진 시각(하루 두 번)과 수동 실행에서만 돈다.
      - name: 색인 상태 갱신
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          SA_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          GSC_PROPERTY: ${{ vars.GSC_PROPERTY }}
        run: |
          if [ -z "$SA_KEY" ]; then
            echo 'GCP_SERVICE_ACCOUNT 시크릿이 없어 건너뜁니다.'
            exit 0
          fi
          trap 'rm -f /tmp/sa.json' EXIT
          printf '%s' "$SA_KEY" > /tmp/sa.json
          chmod 600 /tmp/sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json npx tsx scripts/index-status.mts

      # 초안을 12시간마다 한 편씩 내보낸다. 글은 미리 써 두고 나가는 속도만 늦춘다 —
      # 짧은 기간에 몰아 올리면 검색엔진이 주소만 발견해 두고 크롤링을 미룬다.
      # 간격은 스크립트가 마지막 발행 시각으로 지키므로 수동 실행에도 안전하다.
      # 이 단계는 빌드보다 먼저 와야 한다. 발행된 글이 이번 빌드의 정적 페이지에
      # 들어가야 사이트맵과 함께 바로 알려진다.
      - name: 초안 발행
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          SA_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$SA_KEY" ]; then
            echo 'GCP_SERVICE_ACCOUNT 시크릿이 없어 건너뜁니다.'
            exit 0
          fi
          trap 'rm -f /tmp/pub.json' EXIT
          printf '%s' "$SA_KEY" > /tmp/pub.json
          chmod 600 /tmp/pub.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/pub.json npx tsx scripts/publish-daily.mts

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
